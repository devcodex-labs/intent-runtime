name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  sdk-v2-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - name: Fetch fixed VextJS source outside the checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/intent-runtime-consumer/source"
          curl --fail --location --retry 3 https://api.github.com/repos/devcodex-labs/vextjs/tarball/2458a718179d58e8fabc6e5577f58e4da6be6f1e -o "$RUNNER_TEMP/intent-runtime-consumer/vextjs.tar.gz"
          tar -xzf "$RUNNER_TEMP/intent-runtime-consumer/vextjs.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/intent-runtime-consumer/source"
      - name: Verify installed package with the actual VextJS MCP factory
        env:
          VEXTJS_SOURCE_ROOT: ${{ runner.temp }}/intent-runtime-consumer/source
        run: npm run test:consumer
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix website
      - run: npm run docs:check
      - run: npm --prefix website run check:examples
      - run: npm run docs:build
      - run: npm --prefix website run check:rendered
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run smoke:release
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20.0.0", "24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke:validation
      - run: npm run smoke:release
      - run: node evaluations/mcp-protocol.mjs
      - run: npm run smoke:package
      - run: npm run smoke:installation
      - run: npm run smoke:maintenance
