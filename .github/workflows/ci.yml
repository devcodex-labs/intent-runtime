name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: {node-version: '24.x', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Verify generated schemas are current
        run: npm run schema:generate && git diff --exit-code -- src/contracts/generated.ts
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix website
      - run: npm --prefix website run check
      - run: npm --prefix website run build
        env: {INTENT_DOCS_DIR: '${{ runner.temp }}/intent-docs'}
  runtime:
    name: runtime (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.0.0', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: {node-version: '${{ matrix.node }}', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm test
        env: {INTENT_TEST_DIR: '${{ runner.temp }}/intent-tests'}
      - run: npm run check:package
        env: {INTENT_PACKAGE_CHECK_DIR: '${{ runner.temp }}/intent-package-check'}
