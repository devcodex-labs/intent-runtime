name: Deploy Docs

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact validated release commit
        required: true
        type: string

concurrency:
  group: documentation-pages
  # Queue rather than cancel: let an in-progress (release) deployment finish,
  # as in GitHub's official Pages starter workflow.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
      - name: Verify deployment commit
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix website
      - run: npm --prefix website run check
      - run: npm --prefix website run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
