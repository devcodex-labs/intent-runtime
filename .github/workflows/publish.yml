name: Publish npm Package
on:
  push:
    tags: ['v*']
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: {node-version: '24.x'}
      - run: node scripts/check-release.mjs
  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-release
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: '24.x', registry-url: 'https://registry.npmjs.org/', package-manager-cache: false}
      - run: npm ci --ignore-scripts
      - run: npm run check:package
        env: {INTENT_PACKAGE_CHECK_DIR: '${{ runner.temp }}/intent-package-check'}
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: |
            ${{ runner.temp }}/intent-package-check/archives/*.tgz
            ${{ runner.temp }}/intent-package-check/archives/SHA256SUMS
          if-no-files-found: error
      - name: Check whether this exact package was already published
        id: registry
        run: npm run release:registry -- plan "${{ runner.temp }}/intent-package-check/archives/"*.tgz
      - name: Publish the verified package
        if: steps.registry.outputs.publish == 'true'
        run: npm publish "${{ runner.temp }}/intent-package-check/archives/"*.tgz --access public --provenance
        env: {NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'}
      - name: Verify registry bytes, default installation and installed entry points
        run: npm run release:registry -- verify "${{ runner.temp }}/intent-package-check/archives/"*.tgz
        env: {INTENT_RELEASE_VERIFY_DIR: '${{ runner.temp }}/intent-registry-verification'}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-registry-verification
          path: ${{ runner.temp }}/intent-registry-verification/registry-verification.json
          if-no-files-found: warn
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: {node-version: '24.x'}
      - uses: actions/download-artifact@v7
        with: {name: npm-package, path: '${{ runner.temp }}/intent-release-assets'}
      - name: Create or resume the tagged GitHub Release
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ github.ref_name }}'}
        run: |
          node scripts/check-release.mjs --notes > "$RUNNER_TEMP/intent-release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/intent-release-notes.md"
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/intent-release-assets/"*.tgz "$RUNNER_TEMP/intent-release-assets/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/intent-release-assets/"*.tgz "$RUNNER_TEMP/intent-release-assets/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/intent-release-notes.md"
          fi
  docs:
    needs: release
    uses: ./.github/workflows/docs.yml
    with: {ref: '${{ github.sha }}'}
    permissions: {contents: read, pages: write, id-token: write}
