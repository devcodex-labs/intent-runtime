name: Publish npm Package

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Verify stable tag and package version
        run: node scripts/check-release-tag.mjs
      - name: Determine changes since the published release
        id: scope
        run: node scripts/check-release-scope.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require reviewed evidence for behavior changes
        if: steps.scope.outputs.requires_review == 'true'
        env:
          EVIDENCE_RUN_ID: ${{ vars.RELEASE_EVIDENCE_RUN_ID }}
          EVIDENCE_SHA256: ${{ vars.RELEASE_EVIDENCE_SHA256 }}
        run: node --input-type=module -e 'if (!/^\d+$/.test(process.env.EVIDENCE_RUN_ID || "") || !/^[a-f0-9]{64}$/.test(process.env.EVIDENCE_SHA256 || "")) throw new Error("Behavior changes require a reviewed evidence run and SHA-256 in npm-release.");'
      - uses: actions/download-artifact@v7
        if: steps.scope.outputs.requires_review == 'true'
        with:
          name: release-acceptance
          run-id: ${{ vars.RELEASE_EVIDENCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/intent-release-evidence
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run smoke:validation
      - run: npm run smoke:release
      - run: node evaluations/mcp-protocol.mjs
      - run: npm run smoke:package
      - run: npm run smoke:installation
      - run: npm run smoke:maintenance
      - name: Pack release asset
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/intent-package"
          npm pack --pack-destination "$RUNNER_TEMP/intent-package" --json > "$RUNNER_TEMP/intent-package/pack.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const dir = path.join(process.env.RUNNER_TEMP, 'intent-package');
          const [{ filename }] = JSON.parse(fs.readFileSync(path.join(dir, 'pack.json'), 'utf8'));
          if (path.basename(filename) !== filename) throw new Error('Unexpected package filename.');
          const tarball = path.join(dir, filename);
          const hash = createHash('sha256').update(fs.readFileSync(tarball)).digest('hex');
          fs.writeFileSync(path.join(dir, 'SHA256SUMS'), `${hash}  ${filename}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\n`);
          NODE
      - name: Verify exact main-branch platform CI
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { verifyReleaseCi } from './scripts/release-evidence.mjs';
          const repository = 'devcodex-labs/intent-runtime';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const token = process.env.GH_TOKEN;
          const headers = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(token ? { Authorization: `Bearer ${token}` } : {}) };
          const query = new URLSearchParams({ branch: 'main', event: 'push', head_sha: commit, per_page: '10' });
          const response = await fetch(`https://api.github.com/repos/${repository}/actions/workflows/ci.yml/runs?${query}`, { headers, signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error('Cannot locate exact main-branch CI.');
          const { workflow_runs: runs } = await response.json();
          const run = runs.find(run => run.head_sha === commit && run.status === 'completed' && run.conclusion === 'success');
          if (!run) throw new Error('No successful main-branch CI for this exact release commit.');
          await verifyReleaseCi({ repository, commit, runId: run.id, token });
          console.log('Exact release commit and all required main-branch platform CI checks verified.');
          NODE
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify reviewed evidence for behavior changes
        if: steps.scope.outputs.requires_review == 'true'
        run: node scripts/check-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT_RELEASE_EVIDENCE: ${{ runner.temp }}/intent-release-evidence/release-acceptance.json
          INTENT_RELEASE_EVIDENCE_SHA256: ${{ vars.RELEASE_EVIDENCE_SHA256 }}
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: |
            ${{ runner.temp }}/intent-package/*.tgz
            ${{ runner.temp }}/intent-package/SHA256SUMS
          if-no-files-found: error
          overwrite: true
      - run: npm publish "${{ steps.package.outputs.tarball }}" --access public --provenance
        env:
          # Optional bootstrap token; configured trusted publishing uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.tgz release-assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.tgz release-assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
